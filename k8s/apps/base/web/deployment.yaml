apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      securityContext: { runAsNonRoot: true }       # nginx-unprivileged (uid 101)
      containers:
        - name: web
          image: web
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }   # point-frontend/nginx.conf
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
