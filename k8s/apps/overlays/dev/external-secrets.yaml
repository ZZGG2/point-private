# Secrets Manager JSON 의 키 하나하나 → K8s Secret 의 키 (envFrom 으로 그대로 환경변수가 됨)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monolith-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-sm
  target:
    name: monolith-db            # deployment 의 secretRef 와 일치
  dataFrom:
    - extract:
        key: point-dev/monolith  # DB_URL, DB_USERNAME, DB_PASSWORD, JWT_PRIVATE_KEY, ADMIN_API_TOKEN
  data:
    # local 프로필의 application-local.yml 이 app.admin.api-token=local-admin-token 으로 덮어써서
    # ADMIN_API_TOKEN(application.yml 의 ${} 자리표시자)이 무시된다 →
    # 속성을 직접 가리키는 환경변수(relaxed binding)는 모든 설정 파일보다 우선
    - secretKey: APP_ADMIN_APITOKEN
      remoteRef:
        key: point-dev/monolith
        property: ADMIN_API_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: event-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-sm
  target:
    name: event-secrets
  dataFrom:
    - extract:
        key: point-dev/event-service   # JWT_PUBLIC_KEY
