# Secrets Manager JSON 의 키 하나하나 → K8s Secret 의 키 (envFrom 으로 그대로 환경변수가 됨)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: core-service-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-sm
  target:
    name: core-service-db            # deployment 의 secretRef 와 일치 (point-infra 와 같은 이름)
  dataFrom:
    - extract:
        key: point-dev/core-service  # DB_URL, DB_USERNAME, DB_PASSWORD, JWT_PRIVATE_KEY
    # ADMIN_API_TOKEN 은 core-service 에서 빠졌다: 정산 API 제거(ADR-0018) 후 core-service 에 관리자 API 가 없다.
    # 이벤트 생성 API 의 토큰은 event-secrets 에 있다
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: event-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-sm
  target:
    name: event-secrets
  dataFrom:
    - extract:
        key: point-dev/event-service   # JWT_PUBLIC_KEY, ADMIN_API_TOKEN (이벤트 생성 API POST /api/events/admin/{id})
