# 11단계 — ADR-0013 db-init: 7단계 7-6 에서 손으로 한 app_rw 생성/권한을 ArgoCD PreSync hook 으로.
# 둘 다 hook 이어야 한다: PreSync 는 "본 리소스 sync 전에" 실행되므로, 일반 리소스로 두면 Secret 이 아직 없어 교착.
# 순서: (PreSync, wave -1) ExternalSecret db-master → (PreSync, wave 0) Job db-init → 본 sync
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-master
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-sm }
  target:
    name: db-master                 # 이 Job 만 참조. 앱 파드에는 마스터 비밀이 없다
    template:
      data:                         # psql 이 그대로 읽는 PG* 환경변수 이름으로 변환
        PGHOST: '{{ .DB_URL | regexFind "//[^:/]+" | trimPrefix "//" }}'
        PGUSER: '{{ .username }}'
        PGPASSWORD: '{{ .password }}'
        APP_PW: '{{ .DB_PASSWORD }}'
  data:
    # ⚠️ RDS 를 다시 만들면 이름이 바뀐다 → terraform output rds_master_secret_arn 의 이름 부분으로 갱신
    - { secretKey: username, remoteRef: { key: "rds!db-c87681e3-0e2c-4778-853d-de393fe35e35", property: username } }
    - { secretKey: password, remoteRef: { key: "rds!db-c87681e3-0e2c-4778-853d-de393fe35e35", property: password } }
    - { secretKey: DB_URL,      remoteRef: { key: point-dev/monolith, property: DB_URL } }
    - { secretKey: DB_PASSWORD, remoteRef: { key: point-dev/monolith, property: DB_PASSWORD } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation   # 다음 sync 직전에 지움 → 마지막 실행 로그를 볼 수 있다
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16
          envFrom: [{ secretRef: { name: db-master } }]
          env:
            - { name: PGDATABASE, value: point }
            - { name: PGSSLMODE, value: require }
          command: ["sh", "-c"]
          # $$ 금지 (K8s 가 $ 로 바꿈) → $do$. 여러 번 실행해도 안전 (ELSE 로 비밀번호 갱신)
          args:
            - |
              psql -v ON_ERROR_STOP=1 <<SQL
              DO \$do\$ BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='app_rw') THEN
                  CREATE ROLE app_rw LOGIN PASSWORD '$APP_PW';
                ELSE
                  ALTER ROLE app_rw LOGIN PASSWORD '$APP_PW';
                END IF;
              END \$do\$;
              GRANT CONNECT, CREATE ON DATABASE point TO app_rw;
              GRANT USAGE, CREATE ON SCHEMA public TO app_rw;
              SQL
