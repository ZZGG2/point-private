apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: point
resources:
  - ../../base/core-service
  - ../../base/event-service
  - ../../base/web
  - external-secrets.yaml
  - gateway.yaml
  - scaledobject.yaml              # 10단계
  - db-init.yaml                  # 11단계 (ArgoCD PreSync hook)
  - servicemonitor.yaml           # 12단계
configMapGenerator:
  - name: core-service-config
    literals:
      - SPRING_PROFILES_ACTIVE=local          # 데모 시드 (9단계 문서 "달라진 점")
      # 원장 반영 Redis Stream 을 읽는다 (point-infra ADR-0019) → event-service 와 같은 ElastiCache
      - REDIS_HOST=CHANGE_ME_redis_primary_endpoint    # terraform output -raw redis_endpoint (Valkey 복제 그룹 primary)
      - REDIS_PORT=6379
      - REWARD_STREAM_ENABLED=true
      - AUTH_COOKIE_SECURE=false              # ALB 가 HTTP 라 Secure 쿠키 불가
      - MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS=true   # 12단계: p95 버킷 (percentiles-histogram 의 "-" 는 빼고 씀)
  - name: event-config
    literals:
      - SPRING_PROFILES_ACTIVE=local          # evt-local 자동 생성
      - REDIS_HOST=CHANGE_ME_redis_primary_endpoint    # terraform output -raw redis_endpoint (core-service 와 같은 값)
      - REDIS_PORT=6379
      - MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS=true   # 12단계: p95 버킷 (percentiles-histogram 의 "-" 는 빼고 씀)
      # JWT_PUBLIC_KEY(Secret) 가 있으면 local 의 jwk-set-uri 보다 우선 (SecurityConfig)
images:
  # v0.2.0 = Kafka 제거(Redis Stream)·core-service·Spring Boot 4·운영 이벤트 생성 API 반영 이미지 (6단계 문서 "다시 빌드")
  - name: core-service
    newName: 822837196792.dkr.ecr.ap-northeast-2.amazonaws.com/point/core-service
    newTag: v0.2.0
  - name: event-service
    newName: 822837196792.dkr.ecr.ap-northeast-2.amazonaws.com/point/event-service
    newTag: v0.2.0
  - name: web
    newName: 822837196792.dkr.ecr.ap-northeast-2.amazonaws.com/point/web
    newTag: v0.2.0
# 10단계: event-service 를 Karpenter NodePool "event" 노드로
# (base 에 replicas 를 안 적었으므로 KEDA/HPA 가 바꾼 파드 수를 apply 가 되돌리지 않는다)
patches:
  - target: { kind: Deployment, name: event-service }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { workload: event }
      - op: add
        path: /spec/template/spec/tolerations
        value: [{ key: workload, value: event, effect: NoSchedule }]
