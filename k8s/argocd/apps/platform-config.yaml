# 컨트롤러의 CRD 를 쓰는 플랫폼 리소스: GatewayClass, NodePool/EC2NodeClass, ClusterSecretStore, Grafana 대시보드
# (Kafka 는 point-infra ADR-0019 로 제거 — 원장 반영은 ElastiCache Redis Stream)
# k8s/platform 아래에는 Helm values.yaml 도 있으므로 include 로 매니페스트만 고른다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/ZZGG2/point-private.git
    targetRevision: master
    path: k8s/platform
    directory:
      recurse: true
      include: "{gateway/*.yaml,karpenter/nodepool-*.yaml,external-secrets/*.yaml,monitoring/dashboards/*.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: default             # 전부 클러스터 전역이거나(GatewayClass 등) namespace 를 직접 적는다(대시보드 ConfigMap → monitoring)
  syncPolicy:
    automated: { prune: true, selfHeal: true }   # 11-5: 수동 Sync 로 Diff 확인 후 켬
    syncOptions: [ServerSideApply=true]
