apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"     # ServiceMonitor CRD 를 point-dev 보다 먼저
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.9.0
      helm:
        releaseName: kps
        valueFiles: [$values/k8s/platform/monitoring/values.yaml]
    - repoURL: https://github.com/ZZGG2/point-private.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, CreateNamespace=true]   # CRD 가 커서 client-side apply 는 annotation 크기 초과
