# 이벤트 전용 NodePool: Spot 우선, c/m 계열, 빈 노드 1분 뒤 회수
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: event
spec:
  template:
    metadata:
      labels: { workload: event }
    spec:
      taints:
        - { key: workload, value: event, effect: NoSchedule }   # event-service 외엔 못 옴
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: ["spot", "on-demand"] }  # Spot 부족 시 On-Demand
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: ["c", "m"] }
        - { key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"] }
        - { key: karpenter.k8s.aws/instance-size, operator: In, values: ["large", "xlarge"] }  # 실습: 큰 인스턴스 방지
        - { key: kubernetes.io/arch, operator: In, values: ["amd64"] }
  limits:
    cpu: "16"                     # 실습 비용 상한 (point-infra 는 400)
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest        # 운영은 버전 고정 (al2023@v2026xxxx) — latest 는 AMI 변경 시 드리프트로 노드 교체
  role: KarpenterNodeRole-point-dev-eks       # terraform output -raw karpenter_node_role_name
  subnetSelectorTerms:
    - tags: { karpenter.sh/discovery: point-dev-eks }
  securityGroupSelectorTerms:
    - tags: { karpenter.sh/discovery: point-dev-eks }
