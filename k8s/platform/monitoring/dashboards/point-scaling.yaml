# 12단계 — Grafana 사이드카가 grafana_dashboard=1 라벨 ConfigMap 을 자동으로 불러온다 (platform-config Application 이 배포)
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-point-scaling
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  point-scaling.json: |
    {
      "uid": "point-scaling",
      "title": "point — 이벤트 확장 (10단계 부하 테스트)",
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "event-service 파드 (Ready) vs HPA 목표",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_status_ready{namespace=\"point\",pod=~\"event-service-.*\",condition=\"true\"})",
              "legendFormat": "ready pods",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"point\",horizontalpodautoscaler=\"keda-hpa-event-service\"}",
              "legendFormat": "HPA desired",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "노드 수 (workload 라벨별)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count by (label_workload, label_karpenter_sh_capacity_type) (kube_node_labels)",
              "legendFormat": "{{label_workload}} {{label_karpenter_sh_capacity_type}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "event-service CPU (requests 대비 %)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"point\",container=\"event-service\"}[1m])) / sum(kube_pod_container_resource_requests{namespace=\"point\",container=\"event-service\",resource=\"cpu\"}) * 100",
              "legendFormat": "avg % of requests (HPA 목표 60)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "RPS (상태코드별)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(http_server_requests_seconds_count{namespace=\"point\",service=\"event-service\",uri!~\"/actuator.*\"}[1m]))",
              "legendFormat": "{{status}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "응답시간 p50 / p95 / p99 (event-service, 서버 측)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"point\",service=\"event-service\",uri!~\"/actuator.*\"}[1m])))",
              "legendFormat": "p50",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"point\",service=\"event-service\",uri!~\"/actuator.*\"}[1m])))",
              "legendFormat": "p95",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"point\",service=\"event-service\",uri!~\"/actuator.*\"}[1m])))",
              "legendFormat": "p99",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "JVM heap (파드별)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"point\",area=\"heap\"})",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        }
      ],
      "tags": [
        "point"
      ]
    }
