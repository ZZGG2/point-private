# 클러스터 전체에서 "AWS Secrets Manager(서울)" 를 aws-sm 이라는 이름으로 참조
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-sm
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      # auth 생략 → 컨트롤러 파드 자신의 자격증명(Pod Identity: external-secrets/external-secrets SA)
