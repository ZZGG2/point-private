apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: smoke
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx            # ← 이 Deployment가 관리할 파드를 고르는 기준
  template:
    metadata:
      labels:
        app: nginx          # ← 위 selector와 반드시 일치
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
